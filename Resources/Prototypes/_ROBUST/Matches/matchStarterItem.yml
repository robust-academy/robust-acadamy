- type: entity
  parent: BaseWallmount
  id: MatchSelector
  name: Match selector
  components:
  - type: MatchSelection
  - type: UserInterface
    interfaces:
      enum.MatchSelectionUiKey.Key:
        type: MatchSelectionBoundUserInterface
  - type: ActivatableUI
    key: enum.MatchSelectionUiKey.Key
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Robust/match.rsi
    layers:
    - state: selector
  - type: Appearance

- type: entity
  parent: BaseWallmount
  id: ServerSelector
  name: Server selector
  components:
  - type: ActivatableUI
    key: enum.ServerSelectionUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ServerSelectionUiKey.Key:
        type: ServerSelectionBoundUserInterface
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Robust/server-selector.rsi
    layers:
    - state: selector
  - type: Appearance
