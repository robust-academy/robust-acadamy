- type: entity
  name: deployable barrier
  id: DeployableBarrierActive
  description: A deployable barrier. Swipe your ID card to lock/unlock it.
  parent: DeployableBarrier
  suffix: Locked
  components:
  - type: Lock
    locked: true
  - type: Physics
    canCollide: True # Otherwise it being set to false overrides barrier lock status (even though it probably shouldn't)
