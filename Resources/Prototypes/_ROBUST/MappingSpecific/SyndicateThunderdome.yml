- type: entity
  parent: Recycler
  id: RecyclerMobile
  name: mobile recycler
  description: What use could this possibly serve?
  suffix: Always Awake, Emagged, Powered
  components:
  - type: Fixtures
    fixtures:
      brrt:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        layer:
        - FullTileLayer
      collision:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        hard: true
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
      conveyor:
        shape: !type:PolygonShape
          vertices:
          - -0.55,-0.55
          - 0.55,-0.55
          - 0.55,0.55
          - -0.55,0.55
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: False
  - type: Sprite
    layers:
    - state: recycler-o1bld
      # No recycler map key because recycler uses wrong state for it on startup
  - type: Physics
    sleepingAllowed: false # Necessary
    bodyType: Dynamic
  - type: Transform
    anchored: false
  - type: MaterialReclaimer
    enabled: true
    powered: true
  - type: AmbientSound
    enabled: true
  - type: Emagged
    emagType: Interaction
